spring.application.name=morrow-wallet
server.port=${PORT:${SERVER_PORT:8080}}

# Hosted cloud database: Neon PostgreSQL. Supply these values through Render's Environment page.
spring.datasource.url=${NEON_JDBC_URL:jdbc:postgresql://localhost:5432/morrow}
spring.datasource.username=${NEON_DB_USER:morrow}
spring.datasource.password=${NEON_DB_PASSWORD:change_me}
spring.datasource.driver-class-name=org.postgresql.Driver

# The app can boot if the database is momentarily unavailable; /health/db reports DB readiness.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000

spring.thymeleaf.cache=true
server.error.include-message=never
server.error.include-binding-errors=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Public hosted mode defaults to disabling arbitrary raw SQL execution.
# Set MORROW_ADMIN_SQL_ENABLED=true only in a trusted local environment.
morrow.admin.sql-workbench-enabled=${MORROW_ADMIN_SQL_ENABLED:false}
