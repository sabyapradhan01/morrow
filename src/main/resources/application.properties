spring.application.name=morrow-wallet
server.port=${PORT:${SERVER_PORT:8080}}

# Oracle Database XE 11g uses SID XE (not a pluggable database / XEPDB1).
spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@localhost:1521:XE}
spring.datasource.username=${ORACLE_DB_USER:MORROW_APP}
spring.datasource.password=${ORACLE_DB_PASSWORD:change_me}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Let the web app start even when the database is temporarily offline; /health/db reports connection status.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000

spring.thymeleaf.cache=false
server.error.include-message=never

# Session and request-safety defaults for the local academic application.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-binding-errors=never

# Enable unrestricted admin SQL locally; disable it on a public hosted demo.
morrow.admin.sql-workbench-enabled=${MORROW_ADMIN_SQL_ENABLED:true}
