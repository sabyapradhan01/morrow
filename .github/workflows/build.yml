name: Build Morrow

on:
  push:
    branches: ["main", "neon-deploy"]
  pull_request:
    branches: ["main", "neon-deploy"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: mvn -B test
        env:
          NEON_JDBC_URL: jdbc:postgresql://localhost:5432/morrow
          NEON_DB_USER: morrow
          NEON_DB_PASSWORD: change_me
          SESSION_COOKIE_SECURE: 'false'
          MORROW_ADMIN_SQL_ENABLED: 'false'
